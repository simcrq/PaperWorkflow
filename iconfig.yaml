# 项目配置文件
# 向 LLM 发送的最大字符数由 processing_rules.max_prompt_chars 控制；超长文档会优先保留关键章节。
# 路径配置 (使用正斜杠 / 或双反斜杠 \\)
paths:
  # 待处理的论文根目录，会自动递归搜索该目录下的 PDF；
  # 注意：务必将待处理的pdf放入input_dir的子文件夹如路径 ./INput/4668 等中，否则会报错！
  input_dir: "./INput"
  # 结果输出目录 (空则默认保存在 PDF 同级目录)
  output_dir: ""
  # 合并输出目录 (空则输出到项目根目录)
  merge_output_dir: "./Merge_outputs"
  # MinerU 转换结果缓存目录，默认当前目录下 temp_markdowns 文件夹
  temp_dir: "./temp_markdowns"

# API 配置
api:
  # MinerU 配置。推荐使用官方 mineru-open-api CLI；旧手写 HTTP 适配器仅用于迁移。
  mineru:
    mode: "official_cli"  # 可选: "official_cli", "local_cli", "api"
    cli_command: "mineru-open-api" # 也可填入完整可执行文件路径
    extract_mode: "precision" # precision (需 Token) 或 flash (小文件免 Token)
    ocr: true # 开启扫描页 OCR；官方 CLI 也支持通过 --ocr 显式开启
    model: "vlm" # precision 模式: vlm / pipeline / html
    timeout: 1800
    # 官方 CLI 优先读取 MINERU_TOKEN 或 mineru-open-api auth 保存的 Token；
    # 也可在此填写 api_key，由工作流安全地传给子进程环境变量。
    polling_interval: 10 # API 轮询间隔(秒)
    api_key: "xxxxxxxxxxxxxxxxx" # 请替换为您的 MinerU API Key，前往 https://mineru.net 申请
    # 只有 mode=api 且明确设为 true 时，才使用旧的手写 v4 HTTP 适配器
    legacy_http: false

  # 大模型配置 (OpenAI 兼容接口)
  llm:
    api_key: "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
    base_url: "https://api.openai.com/v1" # 例如 DeepSeek, Moonshot 等
    model_name: "gpt-5"
    timeout: 400

# 处理规则配置
# 这里的 ID 对应文件夹名称，例如 4586, 4698 等。
# 意思是若`paths`中`input_dir`中子文件夹名称为 4586，则使用 skim 模式处理该文件夹下的所有 PDF。若为 4698，则使用 deep_read 模式处理。
# 若文件夹名称不在列表中，则使用 default_mode 指定的默认模式处理
processing_rules:
  # 是否去除参考文献(可能会误删其他部分) (True/False)
  remove_references: false

  # 额外的可选功能
  is_merger_md: true  # 是否将同一文件夹下的多个 PDF 合并为一个 Markdown 文件输出 (True/False)
  
  # 默认模式 (如果 ID 不在下面列表中)
  default_mode: "skim"
  # Prompt 最大字符数；过长时保留摘要、方法、结果和结论等证据区块
  max_prompt_chars: 60000
  # 每个 E### 证据块的最大字符数
  chunk_chars: 6000
  
  # 精读列表 (Deep Read) - 需要详细总结
  deep_read_ids:
    - "4668"
    - "4670"
    - "4698"
  
  # 浏览列表 (Skim) - 仅摘要和结论
  skim_ids:
    - "4586"
    - "4587"

# 并发配置，防止触发API并发限制
concurrency:
  max_workers: 4 # 同时处理的线程数
